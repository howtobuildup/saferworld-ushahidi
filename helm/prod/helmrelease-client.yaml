apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: saferworld-client
  namespace: saferworld
spec:
  interval: 30m
  chart:
    spec:
      chart: ushahidi-platform-client
      version: ">=0.0.1-alpha.17"
      sourceRef:
        kind: HelmRepository
        name: ushahidi
      interval: 1h
  values:
    image:
      repository: ghcr.io/howtobuildup
      name: platform-client
      tag: "1.0.1"
    backend_url: https://api.saferworld.phoenix.howtobuildup.org
    ingress:
      enabled: true
      annotations:
        cert-manager.io/issuer: letsencrypt-prod
        kubernetes.io/ingress.class: nginx
      host: saferworld.phoenix.howtobuildup.org
      tls:
        - secretName: saferworld-client-tls
          hosts:
            - saferworld.phoenix.howtobuildup.org
