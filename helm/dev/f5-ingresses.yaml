apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-f5-master
  namespace: saferworld
  annotations:
    nginx.org/mergeable-ingress-type: master
    external-dns.alpha.kubernetes.io/controller: ignore
spec:
  ingressClassName: nginx-f5
  tls:
    - hosts:
        - api.saferworld.phoenixplatformdev.xyz
      secretName: saferworld-api-tls
  rules:
    - host: api.saferworld.phoenixplatformdev.xyz
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-f5
  namespace: saferworld
  annotations:
    nginx.org/mergeable-ingress-type: minion
    external-dns.alpha.kubernetes.io/controller: ignore
    nginx.org/client-max-body-size: "60m"
    nginx.org/proxy-next-upstream: "off"
    nginx.org/proxy-read-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
spec:
  ingressClassName: nginx-f5
  rules:
    - host: api.saferworld.phoenixplatformdev.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-f5-master
  namespace: saferworld
  annotations:
    nginx.org/mergeable-ingress-type: master
    external-dns.alpha.kubernetes.io/controller: ignore
spec:
  ingressClassName: nginx-f5
  tls:
    - hosts:
        - saferworld.phoenixplatformdev.xyz
      secretName: saferworld-client-tls
  rules:
    - host: saferworld.phoenixplatformdev.xyz
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-f5
  namespace: saferworld
  annotations:
    nginx.org/mergeable-ingress-type: minion
    external-dns.alpha.kubernetes.io/controller: ignore
spec:
  ingressClassName: nginx-f5
  rules:
    - host: saferworld.phoenixplatformdev.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  name: http
