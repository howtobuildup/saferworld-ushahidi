apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: saferworld-api
  namespace: saferworld
spec:
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: api
            patch: |
              - op: add
                path: /spec/template/spec/volumes
                value:
                  - name: export-storage
                    persistentVolumeClaim:
                      claimName: saferworld-export-storage
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value:
                  - name: export-storage
                    mountPath: /var/www/storage/app/public
          - target:
              kind: Deployment
              name: worker
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  podAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchExpressions:
                            - key: app
                              operator: In
                              values:
                                - platform
                            - key: service
                              operator: In
                              values:
                                - api
                        topologyKey: kubernetes.io/hostname
              - op: add
                path: /spec/template/spec/volumes
                value:
                  - name: export-storage
                    persistentVolumeClaim:
                      claimName: saferworld-export-storage
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value:
                  - name: export-storage
                    mountPath: /var/www/storage/app/public
  chart:
    spec:
      chart: ushahidi-platform-api
      version: ">=0.0.1-alpha.36"
      sourceRef:
        kind: HelmRepository
        name: ushahidi
      interval: 1h
  values:
    image:
      repository: ghcr.io/howtobuildup
      name: platform
      tag: "0.64.0-rc.d22aee4" # {"$imagepolicy": "saferworld:platform-api:tag"}
    config:
      appenv: staging
      timezone: UTC
      db:
        host: mysql
        port: 3306
        database: ushahidi
        username: ushahidi
        password: ushahidi
      redis:
        host: redis
        port: 6379
      drivers:
        cache: redis
        ratelimiter_cache: redis
        queue: redis
    api:
      replicas: 1
      debug: "False"
      ingress:
        enabled: true
        annotations:
          cert-manager.io/issuer: letsencrypt-prod
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/proxy-body-size: "60m"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
        host: api.saferworld.phoenixplatformdev.xyz
        tls:
          - secretName: saferworld-api-tls
            hosts:
              - api.saferworld.phoenixplatformdev.xyz
    worker:
      replicas: 1
    mysql:
      enabled: true
      persistence:
        enabled: true
        storageClass: ebs
        size: 10Gi
    redis:
      enabled: true
