apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
  namespace: saferworld
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@howtobuildup.org
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - selector:
          dnsNames:
            - api.saferworld.phoenixplatformdev.xyz
            - saferworld.phoenixplatformdev.xyz
        http01:
          ingress:
            ingressClassName: nginx-f5
            ingressTemplate:
              metadata:
                annotations:
                  nginx.org/mergeable-ingress-type: minion
                  external-dns.alpha.kubernetes.io/controller: ignore
      - http01:
          ingress:
            ingressClassName: nginx
